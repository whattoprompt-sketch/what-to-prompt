
<!DOCTYPE html>
<html>
<head>
    <title>Backend Connection Tester</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .log { background: #f0f0f0; padding: 10px; border-radius: 5px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Backend Connection Tester</h1>
    <p>Testing connection to <strong>http://127.0.0.1:8888</strong>...</p>
    <div id="status">Connecting...</div>
    <pre id="log" class="log"></pre>

    <script>
        const log = (msg) => document.getElementById('log').textContent += msg + '\n';
        const status = (msg, type) => {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = type;
        };

        async function test() {
            try {
                log("Attempting to fetch root (http://127.0.0.1:8888/)...");
                const res = await fetch('http://127.0.0.1:8888/');
                log(`Response status: ${res.status}`);
                if (res.ok) {
                    const data = await res.json();
                    log(`Response data: ${JSON.stringify(data)}`);
                    status("✅ Connection Successful! Backend is running.", "success");
                } else {
                    status("⚠️ Backend replied with error.", "error");
                }
            } catch (e) {
                log(`Error: ${e.message}`);
                console.error(e);
                status("❌ Connection Failed. Backend is likely NOT running or BLOCKED.", "error");
            }
        }
        test();
    </script>
</body>
</html>
